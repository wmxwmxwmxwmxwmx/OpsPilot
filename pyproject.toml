[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.4.0"
description = "Enterprise AI SRE & Incident Diagnosis Agent — learning foundation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp==2.3.0",
    "pgvector==0.4.2",
    "prometheus-client==0.26.0",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "jsonschema>=4.23,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<1",
    "redis>=5.0,<9",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "langgraph==1.2.16",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary,pool]>=3.3.6,<4",
]

[project.optional-dependencies]
dev = ["PyYAML>=6,<7", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "fakeredis>=2.26,<3"]

[project.scripts]
opspilot-incident-summary = "app.cli.incident_summary:main"
opspilot-runbooks = "app.cli.runbooks:main"
opspilot-checkpoints = "app.cli.checkpoints:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "mcp_integration: opt-in real loopback MCP HTTP tests (OPSPILOT_TEST_MCP=1)",
    "embedding_integration: opt-in configured real embedding provider",
    "observability_integration: live Prometheus/Grafana/Tempo acceptance",
    "redis_integration: opt-in real Redis tests (OPSPILOT_TEST_REDIS_URL)",
    "postgres_integration: opt-in isolated PostgreSQL tests (OPSPILOT_TEST_POSTGRES_URL)",
]
